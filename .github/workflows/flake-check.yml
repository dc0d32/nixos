name: flake check

# Server-side gate. Every host (pb-x1, pb-t480, m-pc, wsl, wsl-arm)
# auto-deploys from origin/main (flake-modules/auto-update.nix), so a
# broken main stalls their upgrades. This runs the same `nix flake check`
# the local pre-push hook does, but on GitHub — catching anything pushed
# with --no-verify or from a machine without the hook.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: flake-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # `nix flake check` realizes every host's system closure + each
      # user's HM activation package — multiple GB. GitHub runners ship
      # ~14 GB free; reclaim the bundled toolchains we don't use first.
      - name: Free disk space
        run: |
          sudo rm -rf /opt/hostedtoolcache /usr/local/lib/android /usr/share/dotnet /usr/local/.ghcup
          df -h /

      - uses: DeterminateSystems/nix-installer-action@main
        with:
          # Pull niri (and friends) from the same binary caches the
          # flake's NixOS module trusts, so CI doesn't compile them from
          # source. niri key verified against the niri-flake source.
          extra-conf: |
            extra-substituters = https://niri.cachix.org https://nix-community.cachix.org
            extra-trusted-public-keys = niri.cachix.org-1:Wv0OmO7PsuocRKzfDoJ3mulSl7Z6oezYhGhR+3W2964= nix-community.cachix.org-1:mB9FSh9qf2dCimDSUo8Zy7bkq5CX+/rkCWyvRCYg3Fs=

      - name: nix flake check
        # PURE, deliberately — no --impure, no NIXOS_ALLOW_PLACEHOLDER.
        #
        # This used to run `NIXOS_ALLOW_PLACEHOLDER=1 nix flake check
        # --impure`, because `nix flake check` walks every entry in
        # nixosConfigurations regardless of which subset ends up in
        # `checks`, and the placeholder hosts asserted on
        # system.build.toplevel. That flag defeated the entire point of
        # this workflow: a real host runs `nixos-rebuild --flake
        # github:…`, which evaluates *purely*, and under pure eval
        # `builtins.getEnv` always returns "" — so the assertion could
        # never pass there no matter what. This gate was green while
        # ah-1's auto-upgrade aborted on literally every run.
        #
        # ah-1 and nixtest are retired, no placeholder hosts remain, and
        # CI now evaluates exactly what a host evaluates. If a future
        # host needs the placeholder pattern, keep it OUT of the
        # auto-deploy bundle until its hardware-configuration.nix is
        # real, and smoke-build it by hand — do not reintroduce the flag
        # here.
        #
        # Only builds the runner's native arch (x86_64-linux); wsl-arm is
        # evaluated but not built.
        run: nix flake check --print-build-logs
