name: update flake.lock

# Reinstates the lapsed "weekly bump" cadence. Opens a PR running
# `nix flake update` every Saturday; on the stable channel this mostly
# carries nixos-26.05 security/bugfix backports plus the non-follows
# inputs (niri-flake, nixos-hardware, …). The in-repo lock is the single
# source every host auto-upgrades against, so bumping it here + letting
# the `flake check` workflow validate the PR keeps the fleet patched
# without hand-running `nix flake update` on the dev box.

on:
  schedule:
    - cron: "0 6 * * 6" # Saturdays 06:00 UTC
  workflow_dispatch:

# The default GITHUB_TOKEN is read-only in this repo (Settings → Actions →
# General → Workflow permissions), so update-flake-lock's `git push` of its
# PR branch 403'd on every scheduled run. Grant the two scopes it needs to
# push the branch and open the PR. A workflow-level `permissions:` block
# overrides the repo's read-only default for this workflow only.
#
# SECOND GATE (repo setting, not fixable here): opening the PR also requires
# Settings → Actions → General → "Allow GitHub Actions to create and approve
# pull requests" to be ENABLED. While it's off, the branch pushes but the PR
# step still fails. Toggle it in the UI, or:
#   gh api -X PUT repos/dc0d32/nixos/actions/permissions/workflow \
#     -F default_workflow_permissions=read -F can_approve_pull_request_reviews=true
permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/update-flake-lock@main
        with:
          pr-title: "flake.lock: weekly input bump"
          pr-labels: dependencies
          pr-body: |
            Automated `nix flake update`.

            Review the input diff and wait for the **flake check** run to
            pass before merging.

            NOTE: PRs opened with the default `GITHUB_TOKEN` do not
            trigger other workflows, so `flake check` may not start
            automatically on this PR. To auto-run CI on the bump PR, set
            `token:` above to a PAT / GitHub App token with `repo` +
            `workflow` scope; otherwise close-and-reopen the PR (or push
            an empty commit) to kick the check.
