services:
  timekpr-central:
    build: .
    # Or pull a prebuilt image instead of `build: .`:
    #   image: yourname/timekpr-central:latest
    container_name: timekpr-central
    restart: unless-stopped
    ports:
      - "8780:8000"          # dashboard + agent endpoint on LAN: http://apphost.lan:8780
    environment:
      ADMIN_USER: admin
      ADMIN_PASS: "CHANGE-ME"   # dashboard basic-auth password
      KIDS: "m,s"
      BUDGET_WEEKDAY: "240"     # minutes Mon-Fri (shared across both hosts)
      BUDGET_WEEKEND: "360"     # minutes Sat-Sun
    volumes:
      - timekpr-data:/data

volumes:
  timekpr-data:
